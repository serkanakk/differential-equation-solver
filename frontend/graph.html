<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>

<body>

    <div class="container">

        <h1>Differential Equation Solver</h1>

        <div class="login-box">

            <h2>Solution Graph</h2>

            <div id="graph"></div>

            <br>

            <button onclick="location.href='history.html'">
                Back
            </button>

        </div>

    </div>

    <script>

        async function loadGraph() {

            const response =
                await fetch(
                    "http://localhost:8080/results");

            const csv =
                await response.text();

            const lines =
                csv.trim().split("\n");

            const time = [];
            const xValues = [];
            const yValues = [];
            const zValues = [];

            for (let i = 3; i < lines.length; i++) {

                const parts =
                    lines[i].split(",");

                time.push(
                    parseFloat(parts[1]));

                xValues.push(
                    parseFloat(parts[2]));

                yValues.push(
                    parseFloat(parts[3]));

                zValues.push(
                    parseFloat(parts[4]));
            }

            const traceX = {
                x: time,
                y: xValues,
                mode: 'lines',
                name: 'X(t)'
            };

            const traceY = {
                x: time,
                y: yValues,
                mode: 'lines',
                name: 'Y(t)'
            };

            const traceZ = {
                x: time,
                y: zValues,
                mode: 'lines',
                name: 'Z(t)'
            };

            Plotly.newPlot(
                'graph',
                [traceX, traceY, traceZ]);
        }

        loadGraph();

    </script>

</body>

</html>
