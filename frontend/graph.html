<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>

<body>

    <div class="container">

        <h1>Differential Equation Solver</h1>

        <div class="login-box">

            <h2>Solution Graph</h2>

            <div id="graph" style="width:100%; height:500px;">
            </div>

            <br>

            <button onclick="location.href='history.html'">
                Back
            </button>

        </div>

    </div>

    <script>

        async function loadGraph() {

            const params =
                new URLSearchParams(
                    window.location.search);

            const solutionId =
                params.get("id");

            const response =
                await fetch(
                    `http://localhost:8080/results?id=${solutionId}`);

            const data =
                await response.json();

            console.log("Solution ID:", solutionId);
            console.log("Data:", data);
            console.log("Length:", data.length);

            const time = [];
            const xValues = [];
            const yValues = [];
            const zValues = [];

            data.forEach(point => {

                time.push(point.time);

                xValues.push(point.x);

                yValues.push(point.y);

                zValues.push(point.z);
            });

            const traceX = {
                x: time,
                y: xValues,
                mode: 'lines',
                name: 'X(t)'
            };

            const traceY = {
                x: time,
                y: yValues,
                mode: 'lines',
                name: 'Y(t)'
            };

            const traceZ = {
                x: time,
                y: zValues,
                mode: 'lines',
                name: 'Z(t)'
            };

            console.log(time);
            console.log(xValues);
            console.log(yValues);
            console.log(zValues);

            Plotly.newPlot(
                'graph',
                [traceX, traceY, traceZ],
                {
                    title: 'Solution Graph',
                    xaxis: {
                        title: 'Time'
                    },
                    yaxis: {
                        title: 'Value'
                    }
                }
            );
        }

        loadGraph();

    </script>

</body>

</html>
