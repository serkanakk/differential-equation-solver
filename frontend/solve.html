<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solve Equation</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>

<body>

    <div class="container">

        <h1>Differential Equation Solver</h1>

        <div class="login-box">

            <h2>Solve Equation</h2>

            <input type="text" id="equation1" placeholder="f1(x,y,z)">

            <input type="text" id="equation2" placeholder="f2(x,y,z)">

            <input type="text" id="equation3" placeholder="f3(x,y,z)">

            <select id="method">
                <option>Euler</option>
                <option>Heun</option>
                <option>RK4</option>
            </select>

            <br><br>

            <input type="button" id="solveBtn" value="Solve">

            <br><br>

            <div id="resultBox">

            </div>

            <h3>Graph</h3>

            <div id="graph" style="width:100%; height:400px;">
            </div>

            <br>

            <button type="button" onclick="location.href='dashboard.html'">
                Back
            </button>

        </div>

    </div>

    <script src="js/app.js"></script>
</body>

</html>
