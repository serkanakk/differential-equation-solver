<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <h1>Differential Equation Solver</h1>

        <div class="login-box">

            <h2>Dashboard</h2>

            <button onclick="location.href='solve.html'">
                Solve Equation
            </button>

            <br><br>

            <button onclick="location.href='history.html'">
                My History
            </button>

            <br><br>

            <button onclick="logout()">
                Logout
            </button>

        </div>

    </div>


    <script>

        async function logout() {
            await fetch(
                "http://localhost:8080/logout");

            location.href =
                "login.html";
        }

    </script>
</body>


</html>
