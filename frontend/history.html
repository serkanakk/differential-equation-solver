<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <h1>Differential Equation Solver</h1>

        <div class="login-box">

            <h2>My History</h2>

            <div id="historyContainer">

            </div>

            <button onclick="location.href='dashboard.html'">
                Back
            </button>

        </div>

    </div>
    <script>
        async function loadHistory() {

            const response =
                await fetch(
                    "http://localhost:8080/history");

            const data =
                await response.json();

            const container =
                document.getElementById(
                    "historyContainer");

            let html = "";

            data.forEach(solution => {

                html += `
                <div>
                    <p><strong>Method:</strong> ${solution.method}</p>
                    <p><strong>Equation 1:</strong> ${solution.equation1}</p>
                    <p><strong>Equation 2:</strong> ${solution.equation2}</p>
                    <p><strong>Equation 3:</strong> ${solution.equation3}</p>

                    <button onclick="location.href='graph.html'">
                        View Graph
                    </button>

                    <hr>
                </div>
            `;
            });

            container.innerHTML = html;
        }

        loadHistory();
    </script>
</body>

</html>
